[project]
name = "ha-lafaer"
version = "0.1.31"
description = "On-demand Home Assistant management panel for Lafaer sensors"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "cryptography>=42.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ASYNC", "B", "S", "SIM"]
ignore = ["S101"]
